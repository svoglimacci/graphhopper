name: Build and Test

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 24, 25-ea ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin

      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Build ${{ matrix.java-version }}
        run: mvn -B clean install -DskipTests

      - name: Run Tests
        id: tests
        run: mvn test

      - name: Rick Roll if Tests Failed
        if: always() && steps.tests.outcome == 'failure' && matrix.java-version == '24'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '![Image](https://github.com/user-attachments/assets/b50b5b80-9470-40e8-ad9f-a28902d45cff)'
            })

      - name: Fail Build if Tests Failed
        if: always() && steps.tests.outcome == 'failure'
        run: exit 1

      - name: Run PIT Mutation Testing
        if: matrix.java-version == '24'
        run: mvn -pl core org.pitest:pitest-maven:mutationCoverage

      - name: Restore Previous Mutation Score
        if: matrix.java-version == '24'
        id: cache-mutation
        uses: actions/cache/restore@v4
        with:
          path: mutation-baseline.txt
          key: mutation-score-${{ github.sha }}
          restore-keys: |
            mutation-score-

      - name: Extract Mutation Score
        if: matrix.java-version == '24'
        id: mutation
        run: |
          HTML_FILE=$(find core/target/pit-reports -name "index.html" -type f | head -1)
          
          if [ -z "$HTML_FILE" ]; then
            echo "::error::PIT report not found"
            exit 1
          fi
          
          MUTATION_SCORE=$(sed -n '/<tbody>/,/<\/tbody>/p' "$HTML_FILE" | grep -o '[0-9]\+%' | sed -n '2p')
          SCORE_NUMBER=$(echo "$MUTATION_SCORE" | grep -o '[0-9]\+')
          
          if [ -z "$SCORE_NUMBER" ]; then
            echo "::error::Could not extract mutation score"
            exit 1
          fi
          
          echo "::notice::Current Mutation Coverage: $MUTATION_SCORE"
          echo "mutation-score=$MUTATION_SCORE" >> $GITHUB_OUTPUT
          echo "score-number=$SCORE_NUMBER" >> $GITHUB_OUTPUT

      - name: Compare with Previous Score
        if: matrix.java-version == '24'
        run: |
          CURRENT_SCORE=${{ steps.mutation.outputs.score-number }}
          
          if [ -f mutation-baseline.txt ]; then
            BASELINE_SCORE=$(cat mutation-baseline.txt)
            echo "::notice::Previous mutation score: ${BASELINE_SCORE}%"
          else
            echo "::notice::No previous score found, setting baseline to current score"
            BASELINE_SCORE=$CURRENT_SCORE
          fi
          
          echo "::notice::Current mutation score: ${CURRENT_SCORE}%"
          
          if [ "$CURRENT_SCORE" -lt "$BASELINE_SCORE" ]; then
            echo "::error::Mutation score decreased from ${BASELINE_SCORE}% to ${CURRENT_SCORE}%"
            exit 1
          else
            echo "::notice::Mutation score maintained or improved: ${CURRENT_SCORE}%"
          fi

      - name: Write Mutation Score to File
        if: matrix.java-version == '24' && github.ref == 'refs/heads/master'
        run: |
          echo "${{ steps.mutation.outputs.score-number }}" > mutation-baseline.txt
          echo "::notice::Saved new baseline: ${{ steps.mutation.outputs.score-number }}%"

      - name: Save New Mutation Score
        if: matrix.java-version == '24' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: mutation-baseline.txt
          key: mutation-score-${{ github.sha }}
