name: PR Rick Roll on Test Failure
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test-and-rickroll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 24
          distribution: temurin

      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build
        run: mvn -B clean compile -DskipTests

      - name: Run Tests
        id: tests
        run: mvn test
        continue-on-error: true

      - name: Rick Roll on PR Test Failure
        if: steps.tests.outcome == 'failure'
        uses: TejasvOnly/random-rickroll@v1.0
        with:
          percentage: 100

      - name: Fail Build if Tests Failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
